[stop]
command:/usr/local/etc/rc.d/nclink_proxy stop
parameters:
type:script
message:stop NC-Link proxy daemon

[start]
command:/usr/local/etc/rc.d/nclink_proxy start
parameters:
type:script
message:start NC-Link proxy daemon

[restart]
command:/usr/local/etc/rc.d/nclink_proxy restart
parameters:
type:script
message:restart NC-Link proxy daemon
description:Restart NC-Link proxy daemon

[status]
command:/usr/local/etc/rc.d/nclink_proxy status
parameters:
errors:no
type:script_output
message:get NC-Link proxy daemon status
