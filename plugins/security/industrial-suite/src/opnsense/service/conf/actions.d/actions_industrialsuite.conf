[monitor_start]
command:/usr/local/etc/rc.d/industrial_suite onestart
parameters:
type:script
message:Start software integrity monitor

[monitor_stop]
command:/usr/local/etc/rc.d/industrial_suite onestop
parameters:
type:script
message:Stop software integrity monitor

[monitor_restart]
command:/usr/local/etc/rc.d/industrial_suite onerestart
parameters:
type:script
message:Restart software integrity monitor

[status]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/industrialsuite/suite.py status
parameters:%s
type:script_output
message:Industrial security status

